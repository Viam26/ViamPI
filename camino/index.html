<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.ViamBitacora || !window.ViamBitacoraData) return;
  var root = document.getElementById('camino-root');
  if (!root) return;

  function revealCamino() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var items = root.querySelectorAll('.camino-chapter-head, .camino-step');
    if (!items.length) return;
    if (reduce || !('IntersectionObserver' in window)) {
      for (var i = 0; i < items.length; i++) items[i].classList.add('in');
      return;
    }
    document.documentElement.classList.add('has-reveal');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.06, rootMargin: '40px 0px -2% 0px' });
    var vh = window.innerHeight || document.documentElement.clientHeight;
    for (var j = 0; j < items.length; j++) {
      var el = items[j];
      el.classList.add('reveal-item');
      var rect = el.getBoundingClientRect();
      if (rect.top < vh * 0.98 && rect.bottom > 0) {
        el.classList.add('in');
      } else {
        io.observe(el);
      }
    }
  }

  ViamBitacora.renderCamino([
    {
      key: 'pulse',
      data: ViamBitacoraData.viampulse,
      base: '../viampulse/bitacora/',
      projectHref: '../viampulse/',
      blurb: 'Del circuito sobre la mesa a la caja final del estetoscopio digital.',
      cover: '../viampulse/bitacora/VP5.jpeg',
    },
    {
      key: 'vision',
      data: ViamBitacoraData.viamvision,
      base: '../viamvision/bitacora/',
      projectHref: '../viamvision/',
      blurb: 'Circuitos, chasis, apps y el carril que da forma al ecógrafo.',
      cover: '../viamvision/bitacora/VV2.jpeg',
    },
    {
      key: 'icaro',
      data: ViamBitacoraData.icaro,
      base: '../icaro/bitacora/',
      projectHref: '../icaro/',
      blurb: 'Bocetos, motores, base y los detalles que convierten a ICARO en robot.',
      cover: '../icaro/bitacora/ICARO%234.jpeg',
    },
  ], root).then(revealCamino);
});
</script>
<script src="../site.js"></script>
