<script>
/* =========================================================
   BITÁCORA — EDITA AQUÍ LAS ENTRADAS
   Copia un bloque y cambia titulo, subtitulo, fecha y media.

   Cada entrada:
   - titulo    : título del paso
   - subtitulo : descripción corta (opcional)
   - fecha     : texto libre, ej. "Ene 2026"
   - media     : array de archivos locales (imagen o video)

   Cada media:
   - src   : ruta relativa a esta carpeta bitacora/ (ej. "01-prototipo.jpg")
   - alt   : texto alternativo / pie de foto
   - forma : opcional — "portrait" | "landscape" | "square"
             (si no pones forma, se detecta sola al cargar)
   - poster: solo videos — imagen de preview (opcional)

   Ejemplo con varias fotos:
   {
     titulo: "Ensamble",
     subtitulo: "Placa y sensor conectados.",
     fecha: "Feb 2026",
     media: [
       { src: "ensamble-1.jpg", alt: "Vista superior" },
       { src: "ensamble-2.jpg", alt: "Detalle del micrófono" },
     ]
   }
   ========================================================= */
const BITACORA = [
  {
    titulo: "Conexiones de circuitos",
    subtitulo: "/.",
    fecha: "May 2026",
    media: [
      { src: "../VP1.jpeg", alt: "Prototipo actual de ViamPulse" },
